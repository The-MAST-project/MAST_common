# Ruff configuration for MAST_common.
#
# Mirrors the MAST fleet standard so every repo formats identically. The ruff
# version is pinned in requirements-dev.txt (ruff==0.16.0); config alone is not
# enough — formatter output can differ between ruff versions.
#
# Every consumer -- MAST_unit, MAST_control, MAST_spec, MAST_gui -- takes this
# repo as a sibling clone (<top>/common/), not a submodule. Formatting done here
# reaches all of them on their next `git pull`, with no pointer to advance and
# no per-consumer pin. See "How each project gets MAST_common" in CLAUDE.md.

line-length = 125
target-version = "py312"

[lint]
# The fleet's rule set, stated as `select` rather than `extend-select`: ruff's own
# defaults have grown over time (0.16 enables ASYNC, TRY, S, PYI, RUF, LOG, PLR, C4
# and TC on top of the historical E4/E7/E9/F), so `extend-select` meant the effective
# rule set changed with the pinned version rather than with a decision. Pinning it
# here is the same concern this file's header raises about the formatter.
#
# Findings those defaults surfaced are not discarded: the ones that were real defects
# are filed (see #87), the rest are style the fleet has not adopted.
select = [
    "F",   # Pyflakes (runtime errors)
    "E",   # pycodestyle (formatting)
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C90", # mccabe complexity
    "SIM", # flake8-simplify
    "TID", # tidy imports
]
# N999 (invalid module name) is not actionable here: `actions/checkout` puts the tree in
# a directory named `MAST_common`, and the uppercase makes it an invalid module name, so
# the rule fires on every package `__init__.py` in CI whatever this repo does.
ignore = ["N999"]

[lint.mccabe]
# A ratchet, not a preference. The default is 10; this is the complexity of the worst
# function in the tree (`parsers.py: parse_units`), so anything more tangled than what is
# already here fails. #88 lists the ten offenders -- each one fixed lowers this number in
# the same PR.
max-complexity = 21

[lint.isort]
# This repo's own modules are imported absolutely as `from common.X import Y`
# (it is consumed as a submodule named `common/`), so `common` must be
# first-party. Without this, ruff's resolver splits the package across the
# third-party and first-party blocks and every isort run reshuffles it.
# Kept identical to the consumers' ruff.toml so the fleet sorts the same way.
known-first-party = ["common"]

[format]
# Ruff's Black-compatible formatter.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true

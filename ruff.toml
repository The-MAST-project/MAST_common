# Ruff configuration for MAST_common.
#
# Mirrors the MAST fleet standard so every repo formats identically. The ruff
# version is pinned in requirements-dev.txt (ruff==0.16.0); config alone is not
# enough — formatter output can differ between ruff versions.
#
# This repo is consumed as a submodule (common/) by MAST_control, MAST_spec and
# MAST_gui; formatting it here does not change those superprojects until their
# submodule pointers are advanced. MAST_unit consumes it as a sibling clone
# instead (MAST_unit#94), where a plain `git pull` is all that is needed --
# see "How each project gets MAST_common" in CLAUDE.md.

line-length = 125
target-version = "py312"

[lint]
# Enable rules from common linters.
extend-select = [
    "F",   # Pyflakes (runtime errors)
    "E",   # pycodestyle (formatting)
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C90", # mccabe complexity
    "SIM", # flake8-simplify
    "TID", # tidy imports
]
# Optionally ignore some rules:
# ignore = ["E501"]  # example: disable line-length enforcement

[lint.isort]
# This repo's own modules are imported absolutely as `from common.X import Y`
# (it is consumed as a submodule named `common/`), so `common` must be
# first-party. Without this, ruff's resolver splits the package across the
# third-party and first-party blocks and every isort run reshuffles it.
# Kept identical to the consumers' ruff.toml so the fleet sorts the same way.
known-first-party = ["common"]

[format]
# Ruff's Black-compatible formatter.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true

# Ruff configuration for MAST_common.
#
# Mirrors the MAST fleet standard so every repo formats identically. The ruff
# version is pinned in requirements-dev.txt (ruff==0.16.0); config alone is not
# enough — formatter output can differ between ruff versions.
#
# This repo is consumed as a submodule (src/common) by MAST_unit, MAST_spec and
# MAST_control; formatting it here does not change those superprojects until
# their submodule pointers are advanced.

line-length = 125
target-version = "py312"

# Automatically fix on save (when the editor is configured to do so).
fix = true

[lint]
# Enable rules from common linters.
extend-select = [
    "F",   # Pyflakes (runtime errors)
    "E",   # pycodestyle (formatting)
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C90", # mccabe complexity
    "SIM", # flake8-simplify
    "TID", # tidy imports
]
# Optionally ignore some rules:
# ignore = ["E501"]  # example: disable line-length enforcement

[format]
# Ruff's Black-compatible formatter.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true

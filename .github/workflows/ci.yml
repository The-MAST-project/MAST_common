# Continuous integration for MAST_common.
#
# This repo runs on BOTH production platforms -- Windows (unit, spec) and Linux
# (control, gui) -- so the suite is matrixed over the two. Darwin is a development
# platform only (tests/conftest.py shims Filer for it) and is deliberately not built.
#
# Only the tests are blocking. `ruff check` reports 202 findings and `ruff format
# --check` 18 files as of 2026-08-09, all pre-existing; gating on them would make
# every run red on day one, which teaches people to ignore CI. They run as advisory
# steps so the debt stays visible, and should be flipped to blocking (drop the
# continue-on-error) once burned down -- ideally in their own mechanical commit, per
# the convention in ruff.toml.
name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report both platforms: a Windows-only or Linux-only break is exactly what this
      # matrix exists to catch, and cancelling the other job hides half the answer.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # ruff.toml sets target-version = "py312"; keep these in step.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-ci.txt -r requirements-dev.txt

      - name: Tests
        # tests/test_imports.py runs first in collection order and fails loudly if the
        # environment is incomplete. Without it the importorskip() guards in the other
        # modules would skip 190 of 201 tests and this job would pass having proved
        # nothing. -ra surfaces any skip that does occur, so it cannot pass unnoticed.
        run: python -m pytest tests/ -q -ra

      - name: Lint (advisory)
        continue-on-error: true
        run: ruff check .

      - name: Format (advisory)
        continue-on-error: true
        run: ruff format --check .
